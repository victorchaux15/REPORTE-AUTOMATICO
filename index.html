<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Ejecutivo Superstore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 60px}
.ui-header{background:#1a1a2e;color:white;padding:20px 24px;border-radius:12px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.ui-header h1{font-size:17px;font-weight:600}
.ui-header p{font-size:12px;color:#94a3b8;margin-top:2px}
.badge{background:#3b82f6;color:white;font-size:10px;font-weight:600;padding:3px 9px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase;margin-left:auto;white-space:nowrap}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:20px;background:white;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.tab{flex:1;padding:11px 16px;font-size:13px;font-weight:600;color:#64748b;background:transparent;border:none;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.tab.active{background:#1d4ed8;color:white}
.tab:hover:not(.active){background:#f1f5f9}
.tab-panel{display:none}.tab-panel.active{display:block}

.card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:22px;margin-bottom:16px}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:10px}
.hints{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.hint{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;padding:5px 11px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;border:none}
.hint:hover{background:#dbeafe;color:#1d4ed8}
textarea{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;color:#1e293b;font-family:'Inter',sans-serif;font-size:13px;padding:13px;resize:vertical;min-height:85px;outline:none;transition:border-color .2s;line-height:1.6}
textarea:focus{border-color:#3b82f6;background:white}
textarea::placeholder{color:#cbd5e1}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.fw{flex:1;min-width:200px}
.fw label{display:block;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.fw input{width:100%;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;color:#1e293b;font-family:'Inter',sans-serif;font-size:13px;padding:10px 13px;outline:none;transition:border-color .2s}
.fw input:focus{border-color:#3b82f6;background:white}
.btn-gen{background:#1d4ed8;color:white;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:11px 22px;cursor:pointer;transition:background .2s;white-space:nowrap}
.btn-gen:hover{background:#1e40af}
.btn-gen:disabled{background:#93c5fd;cursor:not-allowed}
.btn-ask{background:#0f766e;color:white;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:11px 22px;cursor:pointer;transition:background .2s;white-space:nowrap}
.btn-ask:hover{background:#0d6560}
.btn-ask:disabled{background:#5eead4;cursor:not-allowed}
.stbar{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:11px 15px;font-size:13px;color:#1d4ed8;margin-bottom:14px;display:none;align-items:center;gap:10px}
.stbar.vis{display:flex}
.spin{width:14px;height:14px;border:2px solid #bfdbfe;border-top-color:#1d4ed8;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:11px 15px;font-size:12px;color:#dc2626;margin-bottom:14px;display:none;word-break:break-all}
.errbox.vis{display:block}

/* Consulta rápida resultado */
#qrw{display:none}
#qrw.vis{display:block}
.q-answer-box{background:white;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:16px}
.q-answer-hd{background:#0f766e;color:white;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.q-answer-hd span{font-size:13px;font-weight:600}
.q-answer-hd small{font-size:11px;opacity:.8}
.q-answer-body{padding:18px 20px;font-size:13.5px;line-height:1.8;color:#1e293b}
.q-answer-body strong{color:#0f172a}
.q-answer-body h3{font-size:13px;font-weight:700;color:#0f172a;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
/* Tabla de consulta */
.q-tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}
.q-tbl th{background:#f1f5f9;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#475569;padding:7px 10px;border:1px solid #e2e8f0;text-align:left}
.q-tbl td{padding:7px 10px;border:1px solid #e2e8f0;color:#1e293b}
.q-tbl tr:nth-child(even) td{background:#f8fafc}
.q-tbl td.num{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.q-tbl td.pos{color:#16a34a;font-weight:700}
.q-tbl td.neg{color:#dc2626;font-weight:700}
.q-tbl td.rank{text-align:center;font-weight:700;color:#64748b;font-size:11px}
.q-hist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.q-hist-btn{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;border:none}
.q-hist-btn:hover{background:#dbeafe;color:#1d4ed8}
.q-source{font-size:10px;color:#94a3b8;padding:8px 18px;background:#f8fafc;border-top:1px solid #e2e8f0;font-style:italic}

/* Reporte */
#rw{display:none}
#rw.vis{display:block}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:white;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.toolbar span{font-size:12px;color:#475569}
.btn-pdf{background:#dc2626;color:white;border:none;border-radius:7px;font-family:'Inter',sans-serif;font-weight:600;font-size:12px;padding:8px 16px;cursor:pointer}
.btn-pdf:hover{background:#b91c1c}
#report{background:white;font-family:'Inter',sans-serif;font-size:13px;color:#1a1a2e;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.rh{border-bottom:2px solid #1a1a2e;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#1a1a2e;background:#f8fafc}
.rb{padding:26px 26px 18px}
.rt{text-align:center;margin-bottom:18px}
.rt h1{font-size:22px;font-weight:700;color:#1a1a2e;letter-spacing:-.3px}
.rt p{font-size:12px;color:#64748b;margin-top:4px;font-style:italic}
.kpi-tbl{width:100%;border-collapse:collapse;border:1px solid #cbd5e1;margin-bottom:10px}
.kpi-tbl th{background:#f1f5f9;font-size:10px;font-weight:600;text-align:center;padding:6px 8px;border:1px solid #cbd5e1;text-transform:uppercase;letter-spacing:.5px;color:#475569}
.kpi-tbl td{text-align:center;font-weight:700;font-size:18px;padding:8px 8px;border:1px solid #cbd5e1;color:#0f172a}
.kpi-tbl td.g{color:#16a34a}
.kpi-tbl td.b{color:#2563eb}
.kpi-tbl td.o{color:#d97706}
.kpi-cap{font-size:11px;color:#64748b;font-style:italic;text-align:center;margin-bottom:14px}
.narr{font-size:13px;line-height:1.75;color:#1e293b;margin-bottom:18px;text-align:justify}
.narr strong{color:#0f172a}
.sec{margin-bottom:22px}
.sec-lbl{display:flex;align-items:center;gap:10px;margin-bottom:11px;border-bottom:1.5px solid #1a1a2e;padding-bottom:6px}
.pb{font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase;flex-shrink:0}
.pb.cr{background:#dc2626;color:white}
.pb.al{background:#d97706;color:white}
.pb.me{background:#2563eb;color:white}
.sn{font-size:10px;font-weight:700;color:#64748b;flex-shrink:0}
.st{font-size:15px;font-weight:700;color:#1a1a2e}
.ch{position:relative;height:230px;margin-bottom:10px}
.ch.tall{height:280px}
.ib{background:#f0f9ff;border-left:3px solid #0284c7;padding:12px 15px;font-size:12.5px;line-height:1.7;color:#1e293b;text-align:justify;margin-top:10px}
.ib strong{color:#0f172a}
.rf{border-top:1px solid #e2e8f0;padding:8px 20px;display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;background:#f8fafc;margin-top:6px}
@media print{
  body{background:white!important}
  .tabs,.tab-panel:not(.active){display:none!important}
  .tab-panel.active{display:block!important}
  .wrap>*:not(#rw){display:none!important}
  #rw{display:block!important}
  .toolbar{display:none!important}
  #report{border:none!important;border-radius:0!important}
  .rh,.rf{background:#f8fafc!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pb{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ib{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec{page-break-inside:avoid}
  .ch{page-break-inside:avoid}
}
</style>
</head>

<div class="ui-header">
  <div>
    <h1>Generador de Reporte Ejecutivo</h1>
    <p>Sample Superstore 2014–2017 · J. A. Arias · V. Chaux · K. D. Cañón</p>

  <div class="badge">Tesis MDS</div>

<!-- Tabs -->
<div class="tabs">

</div>

<!-- TAB: Consulta rápida -->
<div id="tab-consulta" class="tab-panel active">

    <div class="lbl">Hazme una pregunta sobre el dataset</div>
    <div class="hints" id="qhints">
      <button class="hint" onclick="hq(this)">¿Cuál fue el top 5 de ventas por subcategoría en 2017?</button>
      <button class="hint" onclick="hq(this)">¿Qué región tuvo las ventas más bajas y cuál fue su margen?</button>
      <button class="hint" onclick="hq(this)">¿Cuáles subcategorías generaron pérdidas?</button>
      <button class="hint" onclick="hq(this)">¿Cuál fue el mes con mayor ganancia en 2016?</button>
      <button class="hint" onclick="hq(this)">¿Cómo evolucionaron las ventas año a año?</button>
      <button class="hint" onclick="hq(this)">¿Cuál es el impacto de los descuentos en el margen?</button>
      <button class="hint" onclick="hq(this)">¿Qué segmento tiene mejor relación ventas/ganancia?</button>
      <button class="hint" onclick="hq(this)">¿Cuál fue el trimestre más rentable del período?</button>
      <button class="hint" onclick="hq(this)">Compara 2014 vs 2017: crecimiento en ventas y ganancia</button>
      <button class="hint" onclick="hq(this)">¿Qué modo de envío tiene el mejor margen?</button>
    </div>
    <textarea id="qp" placeholder="Ej: ¿Cuál fue el top 3 de subcategorías con mayor ganancia en 2015? ¿Qué mes tuvo las ventas más bajas?" rows="3"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn-ask" id="bq" onclick="ask()">🔍 Consultar</button>
    </div>
  </div>

  <div class="stbar" id="qsb"><div class="spin"></div><span id="qst">Analizando datos...</span></div>
  <div class="errbox" id="qeb"></div>
  <div id="qrw"></div>
</div>

<!-- TAB: Reporte completo -->
<div id="tab-reporte" class="tab-panel">
  <div class="card">
    <div class="lbl">Prompt del reporte</div>
    <div class="hints">
      <button class="hint" onclick="hp(this)">Reporte ejecutivo completo (todas las secciones)</button>
      <button class="hint" onclick="hp(this)">Solo el año 2017</button>
      <button class="hint" onclick="hp(this)">Rentabilidad por categoría, región y sub-categoría</button>
      <button class="hint" onclick="hp(this)">Análisis de segmentos y tendencias anuales</button>
      <button class="hint" onclick="hp(this)">Descuentos y modos de envío</button>
    </div>
    <textarea id="up" placeholder="Ej: Genera un reporte ejecutivo del año 2017 con KPIs, tendencia, categorías y regiones..."></textarea>
    <div class="row">
      <button class="btn-gen" id="bg" onclick="gen()">▶ Generar Reporte</button>
    </div>
  </div>

  <div class="stbar" id="sb"><div class="spin"></div><span id="st">Consultando Claude...</span></div>
  <div class="errbox" id="eb"></div>

  <div id="rw">
    <div class="toolbar">
      <span id="rm">Reporte generado</span>
      <button class="btn-pdf" onclick="window.print()">⬇ Descargar PDF</button>
    </div>
    <div id="report"></div>
  </div>
</div>

</div><!-- /wrap -->

  return String(n);
}

var SYSPROMPT_ASK = `Eres analista de datos senior especializado en el dataset "Sample Superstore 2014-2017" (retail EE.UU.).
Recibirás el dataset completo en JSON y una pregunta del usuario.
RESPONDE SOLO CON JSON VÁLIDO, sin texto extra ni backticks.

Estructura de respuesta:
{
  "titulo": "Título breve de la respuesta (máx 8 palabras)",
  "resumen": "2-3 oraciones ejecutivas respondiendo directamente la pregunta con cifras exactas del dataset.",
  "tiene_tabla": true/false,
  "tabla": {
    "headers": ["Col1","Col2","Col3"],
    "tipos": ["texto","$","$","%"],  // tipos por columna: "texto","$","%","n","rank"
    "rows": [["valor","1234.56","567.89","12.34"], ...],
    "positivo_col": 1,  // índice de columna a colorear positivo/negativo (opcional, -1 si no aplica)
    "caption": "Descripción breve de la tabla"
  },
  "conclusiones": ["Conclusión 1 con cifra.", "Conclusión 2 con cifra.", "Conclusión 3 con cifra."]
}

REGLAS:
- Usa SIEMPRE cifras exactas del dataset provisto.
- Si la pregunta involucra un año específico (ej. 2017), filtra solo ese año de by_ym.
- Para "top N", ordena correctamente y limita a N filas.
- Para "más bajo" o "mínimo", ordena ascendente.
- Para "pérdidas", filtra profit < 0.
- Para subcategorías por año: escala usando la proporción del año sobre el total.
- Si la pregunta no requiere tabla (ej. comparación simple), pon tiene_tabla: false y tabla: null.
- conclusiones: exactamente 3 puntos con cifras.`;

async function ask(){
  var q = document.getElementById('qp').value.trim();
  var ak = getAK();
  if(!q) return showQErr('Escribe una pregunta.');
  if(!ak||!ak.startsWith('sk-')) return showQErr('API Key inválida. Debe empezar con sk-');

  // Validar años
  var yrs = q.match(/\b(20\d{2})\b/g);
  if(yrs){
    var invalid = yrs.filter(function(y){return !['2014','2015','2016','2017'].includes(y);});
    if(invalid.length) return showQErr('El dataset solo contiene 2014–2017. Año inválido: '+invalid.join(', '));
  }

  setQSt(true,'Analizando datos...');
  hideQErr();

  // Contexto completo del dataset
  var ctx = 'DATASET COMPLETO:\n'+JSON.stringify({
    global:{sales:S.total_sales,profit:S.total_profit,qty:S.total_qty,orders:S.unique_orders,customers:S.unique_customers,margin:S.margin},
    by_year:S.by_year,
    by_ym:S.by_ym,
    by_cat:S.by_cat,
    by_sub:S.by_sub,
    by_region:S.by_region,
    by_seg:S.by_seg,
    by_disc:S.by_disc,
    by_ship:S.by_ship,
    top_customers:S.top_customers,
    orders_by_year:OBY
  });

  var msg = ctx + '\n\nPREGUNTA: ' + q + '\n\nResponde con JSON.';

  try{
    var res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':ak,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:2000,
        system:SYSPROMPT_ASK,
        messages:[{role:'user',content:msg}]
      })
    });
    if(!res.ok){var e=await res.json();throw new Error(e.error?e.error.message:'HTTP '+res.status);}
    var data=await res.json();
    var raw=data.content.filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var clean=raw.replace(/```json/g,'').replace(/```/g,'').trim();
    var parsed;
    try{parsed=JSON.parse(clean);}
    catch(ex){throw new Error('JSON inválido recibido.');}
    setQSt(false);
    renderAnswer(parsed, q);
  }catch(err){
    setQSt(false);
    showQErr('Error: '+err.message);
  }
}

var qHistory = [];

function renderAnswer(d, q){
  qHistory.unshift({q:q,d:d});
  if(qHistory.length>5) qHistory.pop();

  var h='';
  h+='<div class="q-answer-box">';
  h+='<div class="q-answer-hd"><span>'+d.titulo+'</span><small>'+new Date().toLocaleTimeString('es-CO')+'</small></div>';
  h+='<div class="q-answer-body">';

  // Resumen
  h+='<p>'+d.resumen+'</p>';

  // Tabla
  if(d.tiene_tabla && d.tabla){
    var t=d.tabla;
    h+='<h3>'+t.caption+'</h3>';
    h+='<table class="q-tbl"><thead><tr>';
    t.headers.forEach(function(hd,i){h+='<th>'+hd+'</th>';});
    h+='</tr></thead><tbody>';
    t.rows.forEach(function(row,ri){
      h+='<tr>';
      row.forEach(function(cell,ci){
        var tipo = (t.tipos&&t.tipos[ci])||'texto';
        var cls='';
        var val=cell;
        if(tipo==='$'){
          var num=parseFloat(String(cell).replace(/[^0-9.\-]/g,''));
          cls='num';
          if(t.positivo_col===ci) cls+= num<0?' neg':' pos';
          val=isNaN(num)?cell:fmt(num);
        } else if(tipo==='%'){
          var num=parseFloat(String(cell).replace(/[^0-9.\-]/g,''));
          cls='num';
          if(t.positivo_col===ci) cls+= num<0?' neg':' pos';
          val=isNaN(num)?cell:num.toFixed(1)+'%';
        } else if(tipo==='n'){
          var num=parseFloat(String(cell).replace(/[^0-9.\-]/g,''));
          cls='num';
          val=isNaN(num)?cell:fmt(num,'n');
        } else if(tipo==='rank'){
          cls='rank';
          val='#'+cell;
        }
        h+='<td class="'+cls.trim()+'">'+val+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table>';
  }

  // Conclusiones
  if(d.conclusiones && d.conclusiones.length){
    h+='<h3>Conclusiones clave</h3><ul style="list-style:disc;padding-left:20px;margin-top:4px">';
    d.conclusiones.forEach(function(c){h+='<li style="margin-bottom:5px;font-size:12.5px;color:#1e293b">'+c+'</li>';});
    h+='</ul>';
  }

  h+='</div>';
  h+='<div class="q-source">Fuente: Sample Superstore 2014–2017 · 8,680 registros · Pregunta: "'+q+'"</div>';
  h+='</div>';

  // Historial
  if(qHistory.length>1){
    h+='<div style="margin-top:8px"><div class="lbl" style="margin-bottom:6px">Consultas anteriores</div><div class="q-hist">';
    qHistory.slice(1).forEach(function(it,i){
      h+='<button class="q-hist-btn" onclick="reloadQ('+i+')">'+(it.q.length>50?it.q.slice(0,47)+'…':it.q)+'</button>';
    });
    h+='</div></div>';
  }

  var qrw=document.getElementById('qrw');
  qrw.innerHTML=h;
  qrw.classList.add('vis');
  qrw.scrollIntoView({behavior:'smooth',block:'start'});
}

function reloadQ(idx){
  var it=qHistory[idx+1];
  document.getElementById('qp').value=it.q;
  renderAnswer(it.d,it.q);
}

  var sb=document.getElementById('qsb'),st=document.getElementById('qst');

      mkC(id,{type:'line',data:{labels:mths.map(function(m){return m[0];}),datasets:[{label:'Ventas',data:vals,borderColor:'#2563eb',pointBackgroundColor:vals.map(function(_,i){return top3.includes(i)?'#dc2626':'#2563eb';}),pointRadius:vals.map(function(_,i){return top3.includes(i)?6:2;}),fill:false,tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Object.assign({},TT,{callbacks:{label:function(c){return' '+fmt(c.raw);}}})},scales:{x:Object.assign({},gx,{ticks:{maxTicksLimit:12,font:{size:9}}}),y:gy}}});

    }else if(id==='chart_sub'){
      var subs=Object.entries(D.by_sub).sort(function(a,b){return b[1].profit-a[1].profit;});
      mkC(id,{type:'bar',data:{labels:subs.map(function(s){return s[0];}),datasets:[{label:'Ganancia',data:subs.map(function(s){return s[1].profit;}),backgroundColor:subs.map(function(s){return s[1].profit>2000?'rgba(22,163,74,.8)':s[1].profit>0?'rgba(217,119,6,.8)':'rgba(220,38,38,.8)';}),borderRadius:4,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:Object.assign({},TT,{callbacks:{label:function(c){return' '+fmt(c.raw);}}})},scales:{x:Object.assign({},gx,{ticks:{callback:function(v){return fmt(v);}}}),y:Object.assign({},gx,{ticks:{font:{size:10}}})}}});

function renderReport(data,activeYears){
  killCharts();
  var filteredData=filterByYears(activeYears||[]);
  var authors='J. A. Arias · V. Chaux · K. D. Cañón';
  var subtitle=data.report_subtitle||'Período 2014–2017 | 8,680 registros depurados';
  var k=data.kpis||{};
  var totalLT=Object.values(S.by_ship).reduce(function(a,v){return a+v.lead_time_sum;},0);
  var totalSC=Object.values(S.by_ship).reduce(function(a,v){return a+v.count;},0);
  var h='<div class="rh"><span>REPORTE EJECUTIVO · Sample Superstore 2014–2017</span><span>'+authors+'</span></div>';
  h+='<div class="rb">';
  h+='<div class="rt"><h1>Reporte Ejecutivo · Sample Superstore</h1><p>'+subtitle+'</p></div>';
  h+='<table class="kpi-tbl"><thead><tr><th>Ventas</th><th>Ganancia</th><th>Margen</th><th>Ticket prom.</th><th>Pedidos</th><th>Clientes</th><th>Unidades</th><th>Lead time</th></tr></thead><tbody><tr>';
  h+='<td>'+(k.ventas||fmt(S.total_sales))+'</td>';
  h+='<td class="g">'+(k.ganancia||fmt(S.total_profit))+'</td>';
  h+='<td class="o">'+(k.margen||(S.margin+'%'))+'</td>';
  h+='<td class="b">'+(k.ticket||fmt(S.total_sales/S.unique_orders))+'</td>';
  h+='<td>'+(k.pedidos||fmt(S.unique_orders,'n'))+'</td>';
  h+='<td>'+(k.clientes||fmt(S.unique_customers,'n'))+'</td>';
  h+='<td>'+(k.unidades||fmt(S.total_qty,'n'))+'</td>';
  h+='<td class="o">'+(k.lead_time||((totalLT/totalSC).toFixed(2)+' d'))+'</td>';
  h+='</tr></tbody></table>';
  h+='<p class="kpi-cap">Indicador 1 · Panel consolidado de KPIs ejecutivos del período.</p>';
  h+='<p class="narr">'+(data.kpi_narrative||'')+'</p>';
  (data.sections||[]).forEach(function(sec){
    var pc=sec.priority==='CRITICO'||sec.priority==='CRÍTICO'?'cr':sec.priority==='ALTO'?'al':'me';
    h+='<div class="sec"><div class="sec-lbl"><span class="pb '+pc+'">'+sec.priority+'</span><span class="sn">· '+sec.num+'</span><span class="st">'+sec.title+'</span></div>';
    h+='<div class="ch'+(sec.chart_id==='chart_sub'?' tall':'')+'"><canvas id="'+sec.chart_id+'"></canvas></div>';
    h+='<div class="ib">'+sec.insight+'</div></div>';
  });
  h+='</div><div class="rf"><span>'+authors+'</span><span>Generado el '+new Date().toLocaleDateString('es-CO',{year:'numeric',month:'long',day:'numeric'})+'</span></div>';
  document.getElementById('report').innerHTML=h;
  document.getElementById('rw').style.display='block';
  document.getElementById('rm').textContent='Reporte generado · '+new Date().toLocaleString('es-CO');
  document.getElementById('rw').scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(function(){buildCharts(data.sections||[],filteredData);},150);
}

function setSt(v,t){
  var sb=document.getElementById('sb'),st=document.getElementById('st');
  if(v){sb.classList.add('vis');st.textContent=t;document.getElementById('bg').disabled=true;}
  else{sb.classList.remove('vis');document.getElementById('bg').disabled=false;}
}
function showErr(m){var e=document.getElementById('eb');e.textContent=m;e.classList.add('vis');}
function hideErr(){document.getElementById('eb').classList.remove('vis');}
function hp(el){document.getElementById('up').value=el.textContent.trim();}
</script>
